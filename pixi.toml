[workspace]
authors = ["thadryanjs <thadryan@protonmail.com>"]
channels = ["conda-forge"]
name = "ConformalPredIndStudy"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
create-notebook = { args = ["scriptname", "extension", "kernel"], cmd = [
    # create the book
    "touch", "{{ scriptname }}.{{ extension }};",
    # make it into a notebook
    "jupytext", "{{ scriptname }}.{{ extension }}",  "--to",  "notebook;",
    # set the formats for the book
    "jupytext", "--set-formats", "ipynb,{{ extension }}:percent", "{{ scriptname }}.ipynb;",
    # set the kernel for that book
    "jupytext", "--set-kernel", "{{ kernel }}", "{{ scriptname }}.{{ extension }}"
] }

format-code = { cmd = ["black", "*.py"] }

sync-notebooks = { cmd = [
    "jupytext", "--sync", "*.py"
], depends-on = ["format-code"] }

minimal-example = { cmd = [
    "jupyter", "nbconvert", "--execute",
        "00_minimal-example.ipynb",
        "--inplace",
        "--ExecutePreprocessor.kernel_name=python3"
], depends-on = ["sync-notebooks"] }

minimal-example-pdf = { cmd = [
    "jupyter", "nbconvert", "--to", "pdf", "00_minimal-example.ipynb"
], depends-on = ["minimal-example"] }


[dependencies]
scikit-learn = ">=1.7.0,<2"
scipy = ">=1.16.0,<2"
pandas = ">=2.3.1,<3"
pulp = ">=2.8.0,<3"
ipython = ">=9.4.0,<10"
jupytext = ">=1.17.2,<2"
jupyter = ">=1.1.1,<2"
jupyter-book = ">=1.0.4.post1,<2"
black = ">=25.1.0,<26"
matplotlib = ">=3.10.3,<4"
seaborn = ">=0.13.2,<0.14"
openpyxl = ">=3.1.5,<4"
mapie = ">=0.9.1,<0.10"
pyright = ">=1.1.403,<2"
